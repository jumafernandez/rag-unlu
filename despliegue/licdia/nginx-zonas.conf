# Zonas de límite de tasa para ChatDigesto.
#
# Va en /etc/nginx/conf.d/, NO dentro del server{}: la directiva limit_req_zone
# solo es válida en el contexto http, y conf.d/ se incluye ahí.
#
# La memoria compartida guarda el estado por dirección de origen: 10 MB alcanzan
# para unas 160.000 direcciones distintas.
#
# 20 consultas por minuto es holgado para una persona y ajustado para un script:
# cada consulta ejecuta el modelo de embeddings y una llamada paga de generación.
limit_req_zone $binary_remote_addr zone=rag_api:10m rate=20r/m;

# El inicio de sesión valida contra los servidores de Google en cada intento. Diez por
# minuto era poco: la clave del límite es la dirección de origen, y una universidad sale
# por unas pocas compartidas, así que diez personas entrando a la vez se bloqueaban entre
# sí.
limit_req_zone $binary_remote_addr zone=rag_sesion:10m rate=60r/m;

# El resto de la aplicación: los archivos del frontend, el panel y el reenvío de PDF.
# Nada de eso cuesta plata ni consulta a terceros, y en cambio se pide MUCHO: una carga
# de la página son unos diez pedidos, y el panel, mientras muestra una operación en
# curso, consulta estado y log cada pocos segundos. Con un límite pensado para el login
# ---diez por minuto--- mirar una corrida larga devolvía 429 al minuto de empezar.
#
# El número es alto a propósito, por dos razones. La primera es que la clave del límite
# es la dirección de origen, y una universidad sale a internet por unas pocas
# direcciones compartidas: una oficina entera probando el sistema cuenta como un solo
# cliente, y un límite pensado para una persona los deja afuera a todos. La segunda es
# que acá no hay nada que proteger de verdad: son archivos estáticos y actos que el
# portal ya publica abiertamente. Esto no es un control de seguridad, es un freno de
# cortesía contra un cliente descontrolado. Lo que sí cuesta ---la consulta, que ejecuta
# el modelo y paga generación, y el inicio de sesión, que valida contra Google--- tiene
# su propio límite estricto en las zonas de arriba, y ahí es donde importa.
limit_req_zone $binary_remote_addr zone=rag_app:10m rate=1200r/m;
