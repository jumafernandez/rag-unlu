# Cabeceras de seguridad. Va en /etc/nginx/snippets/rag-unlu-cabeceras.conf.
#
# Se incluye dentro de cada location y no a nivel de servidor porque en nginx un
# add_header en un bloque interno REEMPLAZA a los heredados: declararlas arriba y
# agregar una sola adentro haría desaparecer al resto sin aviso.
#
# `always` hace que también acompañen a las respuestas de error, que son
# exactamente las que un atacante provoca a propósito.

# El navegador no adivina el tipo de contenido: si el servidor dice que algo es
# texto, no lo interpreta como script.
add_header X-Content-Type-Options "nosniff" always;

# No se filtra la dirección completa de la página al navegar hacia afuera.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# La aplicación no se puede embeber en un marco ajeno.
add_header X-Frame-Options "DENY" always;

# Política de contenido. La aplicación no consume recursos de terceros salvo el
# script de inicio de sesión de Google, así que el resto queda restringido al
# propio origen. 'unsafe-inline' en estilos es necesario porque el tema de la
# institución se aplica en tiempo de ejecución sobre variables CSS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

# HSTS: el navegador usa HTTPS para todo el dominio y deja de aceptar texto
# plano. Habilitado por decisión de la dirección del laboratorio, con las
# condiciones verificadas el 5 de agosto de 2026: las seis rutas del sitio
# responden por HTTPS, el puerto 80 ya redirige con un 301 permanente, y la
# renovación automática del certificado está activa.
#
# Sin `includeSubDomains` a propósito: alcanza a licdia.unlu.edu.ar y a nada más.
# El plazo es de seis meses, y es el precio de la medida: si alguna vez hiciera
# falta servir algo por HTTP en este dominio, no funcionaría para quien haya
# visitado el sitio dentro de ese plazo, aunque la cabecera se quite.
add_header Strict-Transport-Security "max-age=15768000" always;
