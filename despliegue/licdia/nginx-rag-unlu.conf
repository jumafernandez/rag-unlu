# ChatDigesto en https://licdia.unlu.edu.ar/rag-unlu
#
# Va en /etc/nginx/snippets/rag-unlu.conf, incluido desde el server{} del sitio.
# Requiere además /etc/nginx/conf.d/nginx-zonas.conf, que define las zonas de tasa.

location = /rag-unlu { return 301 /rag-unlu/; }

# Rutas caras: consulta y sesión. Van en un bloque aparte con límite propio porque
# el límite general no puede ser estricto ---una sola carga de la página pide el
# HTML, el JavaScript, la hoja de estilos y tres tipografías--- y son justamente
# estas dos las que cuestan: la consulta ejecuta el modelo y paga generación, y el
# inicio de sesión consulta los servidores de Google.
location ~ ^/rag-unlu/sesion {
    # Iniciar sesión valida contra Google. No cuesta plata, pero tampoco es algo que
    # una persona haga muchas veces seguidas; el margen alcanza para que una oficina
    # entera entre a la vez desde la misma dirección de salida.
    limit_req zone=rag_sesion burst=20 nodelay;
    limit_req_status 429;

    rewrite ^/rag-unlu/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
    proxy_buffering off;

    include snippets/rag-unlu-cabeceras.conf;
}

location ~ ^/rag-unlu/consultar {
    limit_req zone=rag_api burst=20 nodelay;
    limit_req_status 429;

    rewrite ^/rag-unlu/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
    proxy_buffering off;          # las respuestas se emiten en flujo

    include snippets/rag-unlu-cabeceras.conf;
}

location /rag-unlu/ {
    # Zona propia y holgada. Antes acá estaba `rag_sesion`, que es la del inicio de
    # sesión: diez por minuto para TODA la aplicación. El comentario de arriba ya decía
    # que este límite no podía ser estricto; la zona que se puso decía lo contrario.
    limit_req zone=rag_app burst=200 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
    proxy_buffering off;

    include snippets/rag-unlu-cabeceras.conf;
}
